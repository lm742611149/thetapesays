# Cloudflare Pages project config.
name = "thetapesays"
compatibility_date = "2026-09-18"
pages_build_output_dir = "dist"

# Usage events from functions/api/beacon.js. The dataset is created in the
# dashboard; this names how the Function reaches it. A build fails outright if
# the product isn't enabled for the account, so if deploys start erroring with
# "You need to enable Analytics Engine", that is why.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "tapesays_events"
